# ---------------------------------------------------------------------------
# Mid-function hooks
# ---------------------------------------------------------------------------
# Options > Gameplay: the page constructor sizes its item array for four
# options (`li r5,4`). The panel has a fifth, unused row which we turn into
# the Field of View selector, so make room for five items.
[[midasm_hook]]
address = 0x824DBC0C
name = "Cod3GameplayItemCount"
registers = ["r5"]
after_instruction = true

# Crosshair. CG_DrawCrosshair (0x824447C8) draws the infantry crosshair
# itself and hands mounted guns and vehicles to 0x82439530. Both hooks sit
# where the game has decided a crosshair is shown (cg_drawCrosshair on, not
# in a menu or cutscene, cg_crosshairAlpha above its threshold). With the
# custom crosshair enabled they record that for the HUD and skip the game's
# own drawing by jumping to the epilogue.
#
# Infantry: right after the hit marker is drawn (so it stays). f29 is how far
# the weapon is raised to the sights: 0 hip, 1 fully aimed. The game's own
# crosshair color (white / red over an enemy / green over a friendly / black
# over a dead body) is at r1+112, which the custom crosshair uses by default.
[[midasm_hook]]
address = 0x82444BB8
name = "Cod3CrosshairHook"
registers = ["f29", "r1", "base"]
jump_address_on_true = 0x82444CC0

# Mounted guns and vehicles: the first instruction of the normal (non-'T')
# crosshair in 0x82439530.
[[midasm_hook]]
address = 0x824396D4
name = "Cod3MountedCrosshairHook"
registers = ["r1", "base"]
jump_address_on_true = 0x82439814

# Picture shape (src/game/ultrawide.cpp). The scene setup that RE_RenderScene
# calls (sub_82430210) passes the projection's aspect ratio in f1 to
# nglSetAspect: 16/9 from cg_widescreen, or 1.0 for the game's square renders.
# A wider picture gets its own shape here; the vertical field of view stays
# the game's (Hor+).
[[midasm_hook]]
address = 0x82430340
name = "Cod3SceneAspectHook"
registers = ["f1"]

# Movie skip (src/game/cutscene_skip.cpp). In the movie loop's skip check
# 0x824D0470, both "keep playing" paths meet at 0x824D050C; a true return
# takes the game's own skip path at 0x824D04E4 (the hook sets r31, which that
# path stores through, since a briefing skips from the minimum-time path).
[[midasm_hook]]
address = 0x824D050C
name = "Cod3MovieSkipHook"
registers = ["r31", "base"]
jump_address_on_true = 0x824D04E4

# The skip path itself (reached from the game's own button check and from the
# hook above), only to log every skip the same way.
[[midasm_hook]]
address = 0x824D04E4
name = "Cod3MovieSkipped"

# A level's briefing while the level loads: the level loader makes
# 0x824EECF8 the loading screen (draw the movie frame, present, advance) and
# calls it while it works. On a skip the hook stops the movie, puts the plain
# loading screen back and returns true: return at once, before the prologue.
[[midasm_hook]]
address = 0x824EECF8
name = "Cod3LoadingMovieHook"
registers = ["ctx", "base"]
return_on_true = true

# Where the movie loops start and end, so the skip prompt follows them
# exactly: 0x824EF308 (logos, attract, bonus movies, the finale) and
# 0x824EEBA0 (a level's briefing once the level has loaded; SV_SpawnServer).
[[midasm_hook]]
address = 0x824EF438
name = "Cod3MovieLoopBegin"

[[midasm_hook]]
address = 0x824EF518
name = "Cod3MovieLoopEnd"

[[midasm_hook]]
address = 0x824EEC08
name = "Cod3BriefingLoopBegin"

[[midasm_hook]]
address = 0x824EECD0
name = "Cod3MovieLoopEnd"

# Frame rate limit (src/game/frame_rate.cpp). Com_Frame (0x82536DD0) turns
# com_maxfps into a minimum number of milliseconds per frame (r30) and then
# busy-waits on the clock until that many have passed. Here, both paths have
# joined: r11 = com_maxfps->integer. The hook waits on the host clock (exact
# rates, sleeps instead of spinning), counts the frame for cg_drawFPS and sets
# r30 to 1 so the game's own loop doesn't add a second, rounded wait.
[[midasm_hook]]
address = 0x82536EE0
name = "Cod3FrameLimiterHook"
registers = ["r11", "r30"]

# ---------------------------------------------------------------------------
# Script thread resume (src/game/script_threads.cpp)
# sub_824A6150 resumes a suspended script thread by switching r1 to the
# thread's saved frame (0x824A63AC), reloading every register and branching
# into the middle of the level's yield function (blr at 0x824A6480). The
# hooks below run that thread's host fiber instead; a thread that runs to its
# end continues the engine at 0x824A62A8, right after the start call.
# ---------------------------------------------------------------------------
[[midasm_hook]]
address = 0x824A63AC
name = "cod3_script_resume_prepare"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x824A6480
name = "cod3_script_resume"
registers = ["ctx", "base"]
jump_address_on_true = 0x824A62A8
