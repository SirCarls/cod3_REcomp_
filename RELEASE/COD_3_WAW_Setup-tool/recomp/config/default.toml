# Codegen overrides for default.xex
# Call of Duty 3 (USA, Europe) - Title ID 415607E1, media 2E07093A,
# SHA-1 681724c40e250e584e6585dd903e05afa00a8634

# ---------------------------------------------------------------------------
# setjmp / longjmp (CRT)
#   setjmp 0x82351CC0: codegen turns each call into a host setjmp keyed by the
#     guest jmp_buf address (seven callers, among them sub_824A6150 at
#     0x824A61DC, the script thread scheduler).
#   longjmp 0x8234EEC0: deliberately NOT configured as longjmp_address. It is
#     recompiled as a plain function and replaced by a hook in
#     src/game/script_threads.cpp: on a script thread's fiber a longjmp is the
#     thread yielding; anywhere else it is a host longjmp through the same map.
# ---------------------------------------------------------------------------
setjmp_address = 0x82351CC0

# ---------------------------------------------------------------------------
# Function boundaries the analyzer cannot discover on its own
# ---------------------------------------------------------------------------
[functions]
# C++ "this"-adjustor thunks that live outside every .pdata range and are only
# reached through tail branches.
0x822D2140 = { size = 8 }   # addi r3,r3,4 ; b 0x822CBA28
0x822D0498 = { size = 4 }   # b 0x822D0118


