# ---------------------------------------------------------------------------
# Script thread resume (src/game/script_threads.cpp)
# ScriptThread_Run here is 0x824C5298, instruction for instruction
# default.xex's 0x824A6150 (same length 0x358, the same 214 primary opcodes),
# so the campaign's two hooks (default.toml) sit at the same offsets:
#   resume prepare  0x824A63AC -> 0x824C54F4 (`or r1,r11,r10`)
#   resume          0x824A6480 -> 0x824C55C8 (`blr`), jump 0x824A62A8 -> 0x824C53F0
# The thread argument is at r1+436 and the thread stack 8 KB, as in the
# campaign (`lwz r3,0x2054(r1)` before the start call at 0x824C53EC).
# ---------------------------------------------------------------------------
[[midasm_hook]]
address = 0x824C54F4
name = "cod3_script_resume_prepare"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x824C55C8
name = "cod3_script_resume"
registers = ["ctx", "base"]
jump_address_on_true = 0x824C53F0

# ---------------------------------------------------------------------------
# Script-thread yields (src/game/level_hooks.cpp). The campaign's script code
# is in its level DLLs; this program's game modes are in the executable, with
# the same interface table convention (0x82A98030, 642 calls through it):
# Broc_Wait 0x824C4840 is slot +76 and Broc_WaitFrames 0x824C4910 slot +80
# (the engine's slot / function pairs at 0x825FF0F0, as in the campaign).
# tools/find_yield_sites.py finds the two calls. With script
# threads on host fibers each call returns when the thread is resumed, and
# the `return` hands control straight back to the script, as in the levels.
# ---------------------------------------------------------------------------
[[midasm_hook]]
address = 0x821DE13C
name = "cod3_script_yield_returned"
after_instruction = true
return = true

[[midasm_hook]]
address = 0x821DE26C
name = "cod3_script_yield_returned"
after_instruction = true
return = true
