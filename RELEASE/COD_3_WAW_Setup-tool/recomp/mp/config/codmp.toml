# Codegen overrides for codmp_xenonf.xex
# Call of Duty 3 (USA, Europe) multiplayer program - Title ID 415607E1,
# media 2E07093A, XEX filetime 2006-10-09, SHA-1
# 907985e2f1bdea255b52226ef39acf627c2d7ffc; image 0x82000000..0x82E20000.
# The second program next to default.xex (docs/MULTIPLAYER.md). Evidence for
# every address: dev/agents/multiplayer/NOTES.md (private) and the symbol map
# (tools/name_mp_functions.py).

# ---------------------------------------------------------------------------
# setjmp / longjmp (CRT), the same arrangement as default.toml
#   setjmp 0x82322010: the host setjmp keyed by the guest jmp_buf (seven
#     callers, among them ScriptThread_Run 0x824C5298 at 0x824C5324).
#   longjmp 0x8231E400: NOT configured as longjmp_address. Recompiled as a
#     plain function (longjmp_guest) and replaced by the campaign's hook in
#     src/game/script_threads.cpp: on a script thread's fiber a longjmp is
#     the thread yielding; anywhere else it is a host longjmp.
# ---------------------------------------------------------------------------
setjmp_address = 0x82322010

