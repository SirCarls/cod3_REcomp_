# Codegen overrides for Call of Duty: Black Ops' Xbox 360 default.xex (the campaign and zombies). [waw-decomp]
# Title: Call of Duty: Black Ops (USA, Europe), default.xex SHA-1 177af142c223a49b126c47b59555dd0a87a45541.
#
# Filled in as the codegen and the first runs need it, the way World at War's ../recomp_waw/config/default.toml and
# Call of Duty 4's ../recomp_cod4/config/default.toml were:
#   setjmp_address / longjmp_address  the C runtime's pair (Com_Error leaves a frame with longjmp)
#   [functions]                       functions the analyzer can't find (tail-branch targets, pointer-only functions)
#   [[midasm_hook]]                   the port's hooks, one block each, with the reason
# World at War's addresses carry over through dev/waw-decomp/bo1_360/pairs_sp.tsv (the blind pairing of 2026-10-20)
# and WAWDECOMP-rea-work/waw-decomp-tools/bo1/map_hooks.py; each one is checked in Black Ops' own code before use.

# ---------------------------------------------------------------------------
# setjmp / longjmp (the C runtime's), 2026-11-09:
#   setjmp 0x825FB3A0 is World at War's 0x8244D650 (_setjmp3) in the pairing (4 call votes); it saves r14-r31 into the
#     buffer in r3.
#   longjmp 0x825FB7A0 is World at War's 0x8244DCD0, the same machine code (x360-family's identical-code witness): it
#     reads +312 first (the unwind check) and restores the frame.
# Com_Error leaves the failing frame with longjmp to the setjmp of the thread's frame loop. Recompiled as plain
# functions, longjmp would return into the code that raised the error instead. With both addresses the codegen makes
# host setjmp/longjmp calls keyed by the guest buffer (as World at War's and Call of Duty 4's configs do).
# ---------------------------------------------------------------------------
setjmp_address = 0x825FB3A0
longjmp_address = 0x825FB7A0

# ---------------------------------------------------------------------------
# Function boundaries the analyzer cannot discover on its own
# ---------------------------------------------------------------------------
[functions]
# Reached only by a tail branch and outside every .pdata range: the codegen's first pass stopped on it ("target not
# in any function", 2026-11-09 15:55, waw-bo1-codegen1). World at War's config has the same kind (0x82392D50).
# Codegen discovers its extent itself.
0x8239C0D0 = {}  # b from 0x824430A0

# Functions only reachable through data pointers (vtable slots, callbacks, code references) that have no .pdata
# entry: tools/find_missing_funcs.py on the decrypted image (tools/xex_dump.py) against the codegen's function
# table, 2026-11-09 15:57. The first run stopped on one of them ("Call to invalid or unregistered function at guest
# address 0x825070F8", waw-bo1-boot1, 7 s in, after the GPU emulation had started). Codegen discovers their extent
# itself; the scan's size estimate is in each comment.
0x821B2EC0 = {}  # vtable @0x820186DC (48 bytes in the scan)
0x821B9568 = {}  # pointer @0x82018CC4 (52 bytes in the scan)
0x82211198 = {}  # vtable @0x820205AC (16 bytes in the scan)
