# ---------------------------------------------------------------------------
# The game's main loop and its front end (src/bo1_hooks.cpp), carried over from World at War, 2026-11-09
# ---------------------------------------------------------------------------
# Com_Frame (0x82336208; World at War's 0x8223D8C0 in the pairing, and one of setjmp's callers): the frame count in
# the log (bo1_log_frames) and debug console commands once the game is up (bo1_debug_command, bo1_debug_commands),
# through Cbuf_AddText (0x8232EA30).
[[midasm_hook]]
address = 0x82336208
name = "bo1_frame_start"
registers = ["ctx", "base"]

# Menus_OpenByName (0x8236DF18; World at War's 0x8225FDF0; r5 the name in Black Ops) and UI_SetActiveMenu (0x82373528;
# r3 the local client, r4 the front end's state): each menu the game opens goes into the log (bo1_log_menus).
[[midasm_hook]]
address = 0x8236DF18
name = "bo1_menu_open"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x82373528
name = "bo1_set_active_menu"
registers = ["ctx", "base"]

# ---------------------------------------------------------------------------
# The jump height at any frame rate (bo1_move_snap_hz, src/bo1_hooks.cpp), World at War's waw_move_snap_hz carried
# over, 2026-11-09
# ---------------------------------------------------------------------------
# Pmove (its loop at 0x82154E3C; KisakBlack's Pmove_1, read as information only) runs PmoveSingle from
# ps->commandTime to the command's time in pieces of at most 66 ms. At 0x82154E54, after `add r11,r10,r11`, r10 is
# the piece's start and r11 its end (stored to pm->cmd.serverTime next, then `bl 0x82153A10`, PmoveSingle): the hook
# records the piece.
[[midasm_hook]]
address = 0x82154E54
name = "bo1_move_step"
registers = ["ctx", "base"]

# Sys_SnapVector (0x823C51A8: each of the three floats through fctiwz and back, a cut toward zero to whole units), the
# velocity cut at the end of every PmoveSingle. Its only caller in the whole program is PmoveSingle's `bl` at
# 0x82154D50 (r3 = r28 = ps + 0x30, ps->velocity; it returns to 0x82154D54). Returns true to skip the cut on a piece
# that does not cross a boundary of the fixed clock.
[[midasm_hook]]
address = 0x823C51A8
name = "bo1_move_snap"
registers = ["ctx", "base"]
return_on_true = true
