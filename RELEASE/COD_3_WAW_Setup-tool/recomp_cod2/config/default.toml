# Codegen overrides for Call of Duty 2's default.xex (Xbox 360, USA/Europe),
# SHA-1 16da73ad198bea9f8203063ddb51172508064fb0, title ID 415607D1,
# version 0.0.0.1, built 2005-10-06. [acct2-cod2]
#
# The same keys as Call of Duty 3's recomp/config/default.toml (the SDK's
# src/codegen/config.cpp reads them). Addresses here are CoD2's own; how each
# one was found is in dev/agents/acct2-cod2/NOTES.md.

# ---------------------------------------------------------------------------
# setjmp / longjmp (C runtime). Both found by their translated code: the same
# instructions, addresses aside, as Call of Duty 3's setjmp 0x82351CC0 and
# longjmp 0x8234EEC0 (1.000 match, every other function under 0.16).
# Com_Error (0x8233AB80) longjmps back to the frame loop; the codegen turns
# each setjmp call into a host setjmp keyed by the guest jmp_buf address and
# each longjmp into the host's. Call of Duty 3 hooks its longjmp instead
# because its script threads switch stacks with it; nothing in CoD2 is known
# to do that (to check if a script error hangs). Another IW-engine recomp
# hung after a match when its longjmp was recompiled, not the host's.
# ---------------------------------------------------------------------------
setjmp_address = 0x8229F930
longjmp_address = 0x8229BF80

# ---------------------------------------------------------------------------
# Function starts the codegen can't find on its own: code reached only through
# a data pointer (vtable slots, callback tables) or a code-built address, with
# no .pdata entry. Found by tools/find_missing_funcs.py on the flat image
# (tools/xex_dump.py; its PE header's ImageBase 0x00400000 set to the load
# address 0x82000000 first). The first run stopped at the first of them:
# "Call to invalid or unregistered function at guest address 0x82494B78"
# (vtable @0x824B0020). As in Call of Duty 3's file, the codegen works out
# each one's extent itself; the comment has the scan's size estimate.
# ---------------------------------------------------------------------------
