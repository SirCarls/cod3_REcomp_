# ---------------------------------------------------------------------------
# Jump tables the codegen sized too small (its translated switch has fewer
# cases than the table in the image holds), found by
# results/acct2-cod2-scripts/q/switches.py (each table read from the image,
# entry by entry, while the entries are code addresses). The first one
# stopped the game with "Switch case out of range" (SIGILL) right after a
# level started (run 2026-11-07 16:00): 0x82433740, under CG_Draw2D, switches
# on a stack argument (lwz r11,404(r1)) with no bounds check before it, so the
# codegen saw only case 0 of its 4.
# ---------------------------------------------------------------------------
[[switch_tables]]
address = 0x824337B4
register = 11
labels = [0x824337C8, 0x824337D0, 0x82433B00, 0x82433B00]
