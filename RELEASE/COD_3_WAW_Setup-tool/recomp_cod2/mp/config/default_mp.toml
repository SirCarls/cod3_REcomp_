# Not a function start (tried 2026-11-07 and taken back): the first multiplayer
# run's "XThread::Execute - No function registered at 8228BAB0" names a
# `b 0x8228BAB8` inside the UTF-8 text conversion at 0x8228BA08 (it compares the
# code page with 65001), so the thread's start address the game passed was
# wrong to begin with. Splitting the function there broke the conversion (a
# crash 7 ms in). The cause is upstream; see NOTES.md.
# (16:40: the cause was that cod2mp loaded the campaign's default.xex; fixed by
# Cod2App::OnLoadXexImage.)

# A jump table the codegen sized too small (results/acct2-cod2-scripts/q/switches.py,
# 2026-11-07): 9 cases translated, 14 in the table at 0x8231F008 (its first label
# sits right after the table's 14 words).
[[switch_tables]]
address = 0x8231F004
register = 28
labels = [0x8231F040, 0x8231F0A8, 0x8231F204, 0x8231F1A4, 0x8231F9F0, 0x8231F9F0, 0x8231F28C, 0x8231F30C, 0x8231F30C, 0x8231F418, 0x8231F4E4, 0x8231F74C, 0x8231F5E0, 0x8231F8B8]
