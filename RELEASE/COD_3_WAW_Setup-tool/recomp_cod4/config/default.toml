# Codegen overrides for Call of Duty 4's Xbox 360 default.xex (the campaign). [acct2-cod4]
# Title: Call of Duty 4: Modern Warfare (World), default.xex SHA-1 2f3148ca7e4c17140e0d44714e204f570197af51.
#
# Filled in as the codegen and the first runs need it, the way World at War's ../recomp_waw/config/default.toml was:
#   setjmp_address / longjmp_address  the C runtime's pair (Com_Error leaves a frame with longjmp)
#   [functions]                       functions the analyzer can't find (tail-branch targets, pointer-only functions)
#   [[midasm_hook]]                   the port's hooks, one block each, with the reason

# ---------------------------------------------------------------------------
# setjmp / longjmp (the C runtime's), found 2026-11-07 in the generated code:
#   setjmp 0x820F0CC0 stores f14-f31, LR, CR (+304) and r1 (+144) into the buffer in r3, clears +312 and returns 0;
#     its 10 callers include Com_Init 0x821DDFF0 (it calls Com_Init_Try_Block_Function 0x821DD488) and Com_Frame
#     0x821DD348.
#   longjmp 0x820EEEC0 reads +312 first (the same unwind check as World at War's 0x8244DCD0) and restores the frame;
#     its callers include Com_Error 0x821DB7F0.
# Com_Error leaves the failing frame with longjmp to the setjmp of the thread's frame loop. Recompiled as plain
# functions, longjmp would return into the code that raised the error instead. With both addresses the codegen makes
# host setjmp/longjmp calls keyed by the guest buffer (as World at War's config does).
# ---------------------------------------------------------------------------
setjmp_address = 0x820F0CC0
longjmp_address = 0x820EEEC0

# ---------------------------------------------------------------------------
# Function boundaries the analyzer cannot discover on its own
# ---------------------------------------------------------------------------
[functions]
# Reached only by a tail branch and outside every .pdata range: the codegen's first pass stopped on it ("target not
# in any function", 2026-11-07 17:33). Codegen discovers its extent itself.
0x820B99F8 = {}  # b from 0x820B13D4

# Functions only reachable through data pointers (vtable slots, code references) that have no .pdata entry:
# tools/find_missing_funcs.py on the decrypted image (tools/xex_dump.py) against the codegen's function table,
# 2026-11-07 17:35.
0x820B13C8 = { size = 8 }  # vtable @0x82071464
0x820B13E8 = { size = 8 }  # vtable @0x820714BC
0x820B1410 = { size = 8 }  # vtable @0x820714E0
0x820B99F0 = { size = 8 }  # vtable @0x8207174C
0x820CCB78 = { size = 36 }  # vtable @0x82071568
0x820CCBC0 = { size = 28 }  # vtable @0x8207155C
0x820CEDC8 = { size = 8 }  # vtable @0x82071BD0
0x820CEDE0 = { size = 8 }  # vtable @0x82071BA0
0x820CEDE8 = { size = 8 }  # vtable @0x820714DC
0x820CEDF0 = { size = 8 }  # vtable @0x82071B98
0x820CEE08 = { size = 8 }  # vtable @0x820714C4
0x820CEE30 = { size = 8 }  # vtable @0x82071BA4
0x82283DE0 = { size = 4 }  # vtable @0x8203F090
0x822AE510 = { size = 32 }  # vtable @0x82370D20
0x822C2738 = { size = 12 }  # vtable @0x8237116C
0x822CC1E8 = { size = 8 }  # code-ref @0x822CD804
0x822CC1F0 = { size = 16 }  # code-ref @0x822CD740

# ---------------------------------------------------------------------------
# Calls through a table of function pointers that the codegen takes for switches (src/cod4_hooks.cpp)
# ---------------------------------------------------------------------------
# `lwzx` (an entry of a table of 28-byte records), `mtctr`, `bctr` is also how a jump table looks, so the codegen wrote
# a switch for these three, with no real cases ("detected jump to null value" traps). World at War's 360 code has the
# same function (its sub_821892E8). Each hook calls CTR's target at the `bctr` and returns, which is what the original
# does. Found by a scan of the generated code's 184 switches (results/acct2-cod4-scripts/cod4scan.py), 2026-11-07.
[[midasm_hook]]
address = 0x82283DA0  # bctr of sub_82283D70: record field +0
name = "cod4_ctr_tail_call"
registers = ["ctx", "base"]
return = true

[[midasm_hook]]
address = 0x82283DDC  # bctr of sub_82283DA8: record field +4
name = "cod4_ctr_tail_call"
registers = ["ctx", "base"]
return = true

[[midasm_hook]]
address = 0x8226F9EC  # bctr of sub_8226F9B8: record field +8
name = "cod4_ctr_tail_call"
registers = ["ctx", "base"]
return = true

# ---------------------------------------------------------------------------
# The game's console (src/cod4_hooks.cpp)
# ---------------------------------------------------------------------------
# CL_ConsolePrint (0x822D7040; r4 channel, r5 text): Com_Printf (0x821DC0A0, x360-family's name) formats the line and
# calls it directly on this build; every console line also goes into the log (cod4_log_console).
[[midasm_hook]]
address = 0x822D7040
name = "cod4_console_print"
registers = ["ctx", "base"]

# Com_Frame (0x821DD348: the main loop's once-a-frame call; it sets the frame's error return with setjmp and calls
# Com_ErrorCleanup 0x821DCB30 after an error): a debug console command once the game is up (cod4_debug_command),
# through Cbuf_AddText (0x821DE9D8).
[[midasm_hook]]
address = 0x821DD348
name = "cod4_frame_start"
registers = ["ctx", "base"]

# ---------------------------------------------------------------------------
# The front end's menus (src/cod4_hooks.cpp)
# ---------------------------------------------------------------------------
# Menus_OpenByName (0x821A1630; r4 the menu's name) and UI_SetActiveMenu (0x821A5888; r3 the local client, r4 the
# front end's state), x360-family's names: each menu the game opens goes into the log (cod4_log_menus), so a test can
# tell which screen it is on.
[[midasm_hook]]
address = 0x821A1630
name = "cod4_menu_open"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x821A5888
name = "cod4_set_active_menu"
registers = ["ctx", "base"]

# ---------------------------------------------------------------------------
# Debug: the guest stack pointer (src/cod4_hooks.cpp, off unless cod4_debug_stack)
# ---------------------------------------------------------------------------
# 0x821AE290: the script compiler's string copy (8 KB on the stack), where the first level load wrote to guest
# 0x70160000; Com_Frame's start gives the main loop's own stack pointer to compare.
[[midasm_hook]]
address = 0x821AE290
name = "cod4_trace_stack"
registers = ["ctx", "base"]

# ---------------------------------------------------------------------------
# The native renderer's census (src/cod4_census.cpp, record only, off unless cod4_debug_native_census)
# ---------------------------------------------------------------------------
# 0x82123A88: the draw-surface list loop's (IW3's R_DrawSurfs, 0x82123950) call of a tess function through the table
# at 0x8202FDA0: r28 = surface type * 4, r30 = the pass, r31 = the command buffer context.
[[midasm_hook]]
address = 0x82123A88
name = "cod4_census_tess"
registers = ["ctx", "base"]

# 0x82123BD0: the backend's command loop (0x82123B90) calling a render command through the table at 0x8202FDC0
# (CTR = the command's function).
[[midasm_hook]]
address = 0x82123BD0
name = "cod4_census_command"
registers = ["ctx", "base"]

# The frame-rate audit's first counters (src/cod4_census.cpp, off unless cod4_debug_frame_audit): G_RunFrame's start
# (a server frame) and CG_PredictPlayerState_Internal's start (the client's movement prediction), x360-family's names.
[[midasm_hook]]
address = 0x82252FE0
name = "cod4_audit_server_frame"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x82329358
name = "cod4_audit_prediction"
registers = ["ctx", "base"]

