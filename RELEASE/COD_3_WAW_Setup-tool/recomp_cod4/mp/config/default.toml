# Codegen overrides for Call of Duty 4's Xbox 360 default_mp.xex (multiplayer). [acct2-cod4]
# Title: Call of Duty 4: Modern Warfare (World), default_mp.xex SHA-1 9d2f0236a318f36e31930d01cbe15df641af2f54.
#
# Filled in as the codegen and the first runs need it, the same way as the campaign's ../../config/default.toml.

# ---------------------------------------------------------------------------
# setjmp / longjmp (the C runtime's), found 2026-11-07 in the generated code, as in the campaign:
#   setjmp 0x821217A0 (stores f14-f31, LR, CR +304, r1 +144; clears +312; returns 0); its 10 callers include
#     Com_Init 0x82237318 (it calls Com_Init_Try_Block_Function 0x82236910) and Com_Frame 0x822367B8.
#   longjmp 0x8211E680 (reads +312 first, then restores the frame); its callers include Com_Error 0x82234308.
# ---------------------------------------------------------------------------
setjmp_address = 0x821217A0
longjmp_address = 0x8211E680

