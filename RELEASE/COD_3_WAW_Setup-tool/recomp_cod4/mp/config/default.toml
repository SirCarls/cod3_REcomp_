# ---------------------------------------------------------------------------
# The game's console, the debug command, the menus (../src/cod4_hooks.cpp), as in the campaign
# ---------------------------------------------------------------------------
# CL_ConsolePrint (0x822DDCF0; r4 channel, r5 text): Com_Printf (0x82234CB8) formats the line and calls it directly.
[[midasm_hook]]
address = 0x822DDCF0
name = "cod4_console_print"
registers = ["ctx", "base"]

# Com_Frame (0x822367B8: sets the frame's error return with setjmp, calls Com_ErrorCleanup 0x82235AF8 after an
# error): the debug console command, through Cbuf_AddText (0x82237C50).
[[midasm_hook]]
address = 0x822367B8
name = "cod4_frame_start"
registers = ["ctx", "base"]

# Menus_OpenByName (0x821E4270; r4 the name) and UI_SetActiveMenu (0x821ED6F8; r3 local client, r4 state).
[[midasm_hook]]
address = 0x821E4270
name = "cod4_menu_open"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x821ED6F8
name = "cod4_set_active_menu"
registers = ["ctx", "base"]

# ---------------------------------------------------------------------------
# A jump table the codegen switches on the wrong register
# ---------------------------------------------------------------------------
# The script lexer's action dispatch (the scanner function that GScr_LoadScriptAndLabel's compile reaches) is a
# 99-entry jump table indexed by r10 (`cmplwi cr6,r10,98`, `rlwinm r0,r10,2,0,29`, `lwzx r0,r12,r0`, `bctr`), but the
# codegen wrote `switch (ctx.r7.u32)`. The lexer then ran the wrong token actions: a string token's copy got length -1
# and ran over the stack into its guard page (guest 0x70160000, the first level load, 2026-11-07 18:00). This entry
# gives the codegen the right register; the labels are the table's own entries (read from the image by
# results/acct2-cod4-scripts/jtcheck.py, which checks every switch's register: this is the only one).
[[switch_tables]]  # sub_8220A068: the switch was on r7, the index is r10; table 0x8220A2D4, 99 entries
address = 0x8220A2D0
register = 10
labels = [
  0x8220A4E0, 0x8220A588, 0x8220A5A4, 0x8220A588, 0x8220A588, 0x8220A588,
  0x8220A5C8, 0x8220A61C, 0x8220A658, 0x8220A694, 0x8220A6B8, 0x8220A6DC,
  0x8220A700, 0x8220A724, 0x8220A748, 0x8220A76C, 0x8220A790, 0x8220A7B4,
  0x8220A7D8, 0x8220A7FC, 0x8220A820, 0x8220A844, 0x8220A868, 0x8220A88C,
  0x8220A8B0, 0x8220A8D4, 0x8220A8F8, 0x8220A91C, 0x8220A940, 0x8220A964,
  0x8220A988, 0x8220A9AC, 0x8220A9D0, 0x8220A9F4, 0x8220AA18, 0x8220AA3C,
  0x8220AA74, 0x8220AAAC, 0x8220AAD0, 0x8220AAF4, 0x8220AB18, 0x8220AB3C,
