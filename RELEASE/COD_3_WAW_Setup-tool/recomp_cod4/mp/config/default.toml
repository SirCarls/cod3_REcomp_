# ---------------------------------------------------------------------------
# The native renderer's census and the frame-rate audit (../src/cod4_census.cpp, record only, off unless
# cod4_debug_native_census / cod4_debug_frame_audit). The same code as the campaign's (see ../config/default.toml):
# R_DrawSurfs 0x82154F90 calls a tess function at 0x821550C8 (r28 = surface type * 4, r30 = the pass, r31 = the
# context); the render command loop 0x821551D0 calls a command at 0x82155210 (CTR = its function);
# CG_PredictPlayerState_Internal starts at 0x822F8FA8.
# ---------------------------------------------------------------------------
[[midasm_hook]]
address = 0x821550C8
name = "cod4_census_tess"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x82155210
name = "cod4_census_command"
registers = ["ctx", "base"]

[[midasm_hook]]
address = 0x822F8FA8
name = "cod4_audit_prediction"
registers = ["ctx", "base"]

# ClientEndFrame 0x82286510 (the host's side, once a server frame for each client; r3 = its gentity_s): the audit
# line lists each client's movement type (../src/cod4_census.cpp), so a system-link test can tell that both spawned.
[[midasm_hook]]
address = 0x82286510
name = "cod4_audit_client_end_frame"
registers = ["ctx", "base"]

