# Codegen overrides for World at War's Xbox 360 default.xex (campaign and Nazi Zombies). [acct2-waw]
# Title: Call of Duty: World at War (USA, Europe), default.xex SHA-1 9972cdb7c1bf2f54c6ef7d58c9eb3b6d4a724708.
#
# Still to come, the way Call of Duty 3's ../recomp/config/default.toml has them:
#   more [functions]                  functions only reachable through data pointers (tools/find_missing_funcs.py)
#   [[midasm_hook]]                   the port's hooks, one block each, with the reason

# ---------------------------------------------------------------------------
# setjmp / longjmp (the C runtime's), found 2026-11-07 in the generated code:
#   setjmp 0x8244D650 stores f14-f31, r13, v64-v127, LR (+308), CR (+304) and r1 (+144) into the buffer in r3,
#     clears +312 and returns 0; its 10 callers include Com_Init 0x8223D768 and Com_Frame 0x8223D8C0 (the frame
#     loop's error frame) and 0x82327060, next to Scr_Error 0x82326D10. The decomp's PC pairing
#     calls it _setjmp3.
#   longjmp 0x8244DCD0 reads +312 (an unwind path through 0x82455CB0 / 0x82470E3C when set), else restores LR, r1
#     and CR from the same offsets and returns the value in r4.
# Com_Error leaves the failing frame with longjmp to the setjmp of the thread's frame loop. Recompiled as plain
# functions, longjmp would return into the code that raised the error instead. With both addresses the codegen
# makes host setjmp/longjmp calls keyed by the guest buffer. (MW2's Xbox 360 recomp names the same pair for the same
# reason; Call of Duty 3 hooks longjmp instead because of its script fibers, which World at War's VM doesn't use.)
# ---------------------------------------------------------------------------
setjmp_address = 0x8244D650
longjmp_address = 0x8244DCD0

# ---------------------------------------------------------------------------
# Function boundaries the analyzer cannot discover on its own
# ---------------------------------------------------------------------------
[functions]
# Reached only by tail branches and outside every .pdata range: the codegen's first pass stopped on them
# ("target not in any function", 2026-11-07). Codegen discovers their extent itself.
0x82392D50 = {}  # b from 0x8239367C (in 0x82393598)
0x823AEAF0 = {}  # b from 0x823B2AAC (in 0x823B2940); 16 bytes in the decomp's Ghidra pass

# Functions only reachable through data pointers (vtable slots, callbacks, code references) that have no .pdata
# entry: tools/find_missing_funcs.py on the decrypted image (tools/xex_dump.py) against the codegen's function
# table, 2026-11-07. The first run stopped on the first one ("Call to invalid or unregistered function at guest
# address 0x82450238", a 4-byte function the decomp's Ghidra pass labels KeTlsAlloc, reached from 0x824505A0).
0x82450238 = {}  # code-ref @0x824505A0
0x82146FF0 = {}  # vtable @0x82493A58
0x82147080 = {}  # vtable @0x82493A50
0x821892E8 = {}  # vtable @0x82016B94
0x8227D388 = {}  # code-ref @0x8227D4F4
0x822C8480 = {}  # code-ref @0x822CB31C
0x822C84A0 = {}  # code-ref @0x822CB338
0x823936A8 = {}  # vtable @0x82098B90
0x823936B0 = {}  # vtable @0x82098B60
0x82398740 = {}  # vtable @0x8203C20C
0x823AF418 = {}  # vtable @0x820993E0
0x823B1AB0 = {}  # vtable @0x82098DA0
0x823B1AF8 = {}  # vtable @0x82098D94
0x823B2A60 = {}  # vtable @0x82098B5C
0x823B2A68 = {}  # vtable @0x82098B34
0x823B2A70 = {}  # vtable @0x820995C0
0x823B2A80 = {}  # vtable @0x8209959C
0x823B2A98 = {}  # vtable @0x820995D0

# ---------------------------------------------------------------------------
# Calls through a table of function pointers that the codegen takes for switches (src/waw_hooks.cpp)
# ---------------------------------------------------------------------------
# `lis/addi` (a table's address), `lwzx` (an entry), `mtctr`, `bctr` is also how a jump table looks, so the codegen
# wrote a switch for these two, with wrong cases: the first run with the disc's files (2026-11-07 15:17) trapped
# ("Switch case out of range") in sub_82146FD8 on the fastfile thread. Each hook calls CTR's target at the `bctr` and
# returns, which is what the original does. A scan of the generated code for switches on a table's base register, with
# 1-2 cases or with function cases, found these two of 266.
[[midasm_hook]]
address = 0x82146FEC  # bctr of sub_82146FD8: the entry r3 of the table at 0x82493A50 (0x82147080, ..., 0x82146FF0)
name = "waw_ctr_tail_call"
registers = ["ctx", "base"]
return = true

[[midasm_hook]]
address = 0x82189318  # bctr of sub_821892E8: a 28-byte record's function, from a table found through r3
name = "waw_ctr_tail_call"
registers = ["ctx", "base"]
return = true

# ---------------------------------------------------------------------------
# The sound callback's processor and floating-point state (src/waw_hooks.cpp)
# ---------------------------------------------------------------------------
# 0x82396FB0 is the callback the runtime's audio worker calls. The sound code looks up per-processor state by the
# processor number in the PCR (`lbz r9,268(r13)` in sub_823B1CD8) and only the sound engine's processor has any. The
# hook gives the worker that processor before the callback runs (MW2's Xbox 360 recomp notes the same need: XAudio2's
# workers wait by processor), and masks the host's floating-point exceptions on the worker, which the runtime leaves
# unmasked there.
[[midasm_hook]]
address = 0x82396FB0
name = "waw_sound_callback_start"
registers = ["ctx", "base"]

