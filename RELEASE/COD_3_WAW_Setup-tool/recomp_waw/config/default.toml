# ---------------------------------------------------------------------------
# [waw-decomp-waw] 2026-11-11: the native renderer's hooks (src/waw_native.cpp; record only unless
# waw_debug_native_side draws its check pictures; both settings off by default).
# ---------------------------------------------------------------------------
# 0x824224DC: the draw-list loop's (0x824223D0, IW3's R_DrawSurfs) call of a tess function through the table at
# 0x820ABEC4 (`bctrl`): r31 the run's context, r28 the surface type x 4, r30 the pass index. Not a branch target.
[[midasm_hook]]
address = 0x824224DC
name = "waw_native_run"
registers = ["ctx", "base"]

# 0x8243226C: R_DrawIndexedPrimitive's (0x82432268) second instruction (the first has the census's hook): r3 the
# prim state (the command buffer state + 0xF0), r4 the draw's arguments. Not a branch target.
[[midasm_hook]]
address = 0x8243226C
name = "waw_native_indexed"
registers = ["ctx", "base"]

# 0x824322BC: the tess buffers' draw's (0x824322B8) second instruction: r3 the command buffer state, r4 the draw's
# arguments. Not a branch target.
[[midasm_hook]]
address = 0x824322BC
name = "waw_native_tess"
registers = ["ctx", "base"]

# 0x8235E6D8: Direct3D's swap, at its first instruction (the only caller of VdSwap): the frame's end on the thread
# that draws.
[[midasm_hook]]
address = 0x8235E6D8
name = "waw_native_swap"
registers = ["ctx", "base"]
