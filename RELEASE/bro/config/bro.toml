# Call of Duty 2: Big Red One, the port's settings [acct2-bro-game]
#
# Copy this file next to the game (an installed game: <output>/bro/bro.toml, beside bin/), or point BRO_SETTINGS at
# it. Every setting below is at its default. Each one also has an environment variable (in brackets); a variable
# that is set wins over this file, as the setup tool's Play page and the test runs use them.

version = 1

[display]
# Frames a second at most. Leave it out for the game's own pace (the Xbox's 30); 0 = no limit; 1-1000. [BRO_MAX_FPS]
# max_fps = 0
# The frame-rate counter in the top right corner and in the window's title. [BRO_SHOW_FPS]
show_fps = false
# A log line every this many seconds with the frame rate and the frame's parts (game, drawing, wait); 0 = never.
# [BRO_FPS_LOG]
fps_log = 0
# Frames in step with the display; false shows them as they come. [BRO_VSYNC]
vsync = true
# The window fills the screen. [BRO_FULLSCREEN]
fullscreen = false
# A window at all; false draws offscreen (tests). [BRO_WINDOW]
window = true
# The window opens below the window in use without taking the focus (or the mouse), and on X11 it stays under the
# other windows and can't be given the focus until it's clicked; click it to play (full screen, if asked for, starts
# then). For test runs on a PC someone is using. [BRO_START_IN_BACKGROUND]
start_in_background = false
# The picture's size, "<width>x<height>"; left out, twice the game's 640 x 480. [BRO_VK_SIZE]
# size = "1920x1440"
# The field of view: the angle across the picture, in degrees, 1-160. Left out, the game's own. [BRO_FOV]
# fov = 100
# Movies at their own speed, the game's 30 pictures a second, whatever max_fps is (the frames keep the limit);
# false plays them at the frame rate (to compare). [BRO_MOVIE_PACING]
movie_pacing = true
# Skip every movie (each ends at once, as if it had played out): for test runs that aren't about the movies.
# [BRO_SKIP_MOVIES]
skip_movies = false

[input]
# The sticks' dead zone, 0 to 0.9 of their travel: inside it a stick is at rest, and the rest of its travel is
# stretched over the whole range. 0 leaves it to the game's own. [BRO_DEAD_ZONE]
dead_zone = 0
# The mouse turns the view by how far it moves, as on the PC, never by the frame rate; false moves the right stick
# instead, as before. Either way only while the window holds the mouse. [BRO_RAW_MOUSE]
raw_mouse = true
# As the PC games' "sensitivity": each count of the mouse turns the view 0.022 degrees times this, whatever the frame
# rate. [BRO_MOUSE_SENSITIVITY]
mouse_sensitivity = 5
# On top of that, side to side and up and down apart. [BRO_MOUSE_SCALE_X] [BRO_MOUSE_SCALE_Y]
mouse_scale_x = 1.0
mouse_scale_y = 1.0
# Pushing the mouse forward looks down. [BRO_INVERT_Y]
invert_y = false
# With raw_mouse = false: how far the right stick moves for each pixel the mouse moves. [BRO_MOUSE_SPEED]
mouse_speed = 1600
# While aiming down the sights the mouse turns slower by the zoom, as in CoD3 (the field of view against the one
# before aiming); this multiplies that, 0.05-4. [BRO_ZOOM_SENSITIVITY]
zoom_sensitivity = 1.0
# In play the keyboard and the mouse do the game's own actions, as in CoD3 ([binds] below); false: every key is only
# the controller's button in [keys], as before. [BRO_BINDS]
binds = true
# The same binds in CoD3's own text (cod3.toml's cod3_binds_kbm_p1), so a line from CoD3 works here:
# "fire=MOUSE1;aim=MOUSE2;use=F;...". [binds] below wins over it. [BRO_BINDS_KBM]
# binds_kbm = ""

# [f2-menus] 2026-11-11 The mouse inside this game only: Raw Accel's acceleration curves (no driver, nothing outside
# the game), a sensitivity randomizer, and the sensitivity as another game counts it. All off as shipped; F2's
# CONTROLS page has every one as a row, with graphs. They work on each mouse event with the event's own timing, so
# the frame rate has no part in them. With input.raw_mouse = true only. Each has a variable: BRO_MOUSE_ and its name
# in capitals (BRO_MOUSE_ACCEL_MODE).
[mouse]
# Mouse acceleration inside this game only (Raw Accel's curves, no driver): the faster the mouse moves, the more each
# count turns the view
# accel = false
# Acceleration curve: 0 linear, 1 classic, 2 power, 3 natural, 4 jump, 5 synchronous (Raw Accel's)
# accel_mode = 0
# The curve shapes the gain (Raw Accel's default, smoother); off: it shapes the sensitivity (legacy)
# accel_gain = true
# Linear and classic: the acceleration
# accel_acceleration = 0.005
# Classic: the exponent (2 is linear)
# accel_exponent_classic = 2.0
# Power: the exponent
# accel_exponent_power = 0.05
# Power: the scale
# accel_scale = 1.0
# Power: the sensitivity the curve starts from (0 = from nothing)
# accel_output_offset = 0.0
# Linear, classic and natural: the speed (counts a millisecond) below which nothing is added
# accel_input_offset = 0.0
# Linear, classic and power: what caps the curve: 0 the output cap, 1 the input cap, 2 both
# accel_cap_mode = 0
# The input cap, a speed in counts a millisecond; jump: the speed of the step
# accel_cap_input = 15.0
# The output cap, a sensitivity multiple (0 = no cap); jump: the multiple after the step
# accel_cap_output = 1.5
# Natural: how fast the curve nears its limit
# accel_decay_rate = 0.1
# Natural: the sensitivity multiple the curve nears
# accel_limit = 1.5
# Jump and synchronous: how soft the change is (0 = at once)
# accel_smooth = 0.5
# Synchronous: the speed (counts a millisecond) at which the sensitivity is unchanged
# accel_sync_speed = 5.0
# Synchronous: the sensitivity goes from 1 / this to this
# accel_motivity = 1.5
# Synchronous: how fast the change comes
# accel_gamma = 1.0
# Sensitivity multiplier after the curve
# accel_sens = 1.0
# Up / down sensitivity as a multiple of left / right
# accel_yx_ratio = 1.0
# The mouse's DPI, so speeds mean the same on any mouse (as Raw Accel: counts are scaled to 1000 DPI); 0 = not set,
# counts as they come
# accel_dpi = 0
# The curve takes the whole motion's speed; off: side to side and up / down each by its own
# accel_whole = true
# Sensitivity randomizer inside this game only: the mouse sensitivity wanders around a baseline over time (aim
# training)
# sens_random = false
# Sensitivity randomizer: 0 steps (a new value every timestep), 1 smooth (always moving)
# sens_random_type = 1
# Sensitivity randomizer: the multiple it wanders around (1 = your own sensitivity)
# sens_random_baseline = 1.0
# Sensitivity randomizer: the smallest multiple
# sens_random_min = 0.5
# Sensitivity randomizer: the largest multiple
# sens_random_max = 2.0
# Sensitivity randomizer: how far from the baseline it usually goes (0.1 = barely)
# sens_random_spread = 0.6
# Sensitivity randomizer: 0 no smoothing to 4 the slowest, smoothest changes
# sens_random_smoothing = 2
# Sensitivity randomizer, steps: seconds between two values
# sens_random_timestep = 10.0
# Sensitivity randomizer: minutes it runs after it is turned on, then the baseline (0 = no end)
# sens_random_runtime = 30.0
# Sensitivity randomizer: paused (the multiple and the time left stay where they are)
# sens_random_paused = false
# Sensitivity randomizer: show the live multiple and the time left in the top left corner
# sens_random_show = true
# Sensitivity randomizer: a number that makes the same sequence every time (tests); 0 = a new one each time
# sens_random_seed = 0
# Debug: log the randomizer's multiple every N seconds, with the smallest and largest so far (0 = never)
# sens_random_log = 0
# Type the mouse sensitivity as another game counts it: 0 this game's own, 1 Quake / Source / Counter-Strike 2 / Apex,
# 2 Valorant, 3 Overwatch 2 / modern Call of Duty / Destiny 2, 4 Rainbow Six Siege, 5 Fortnite, 6 Battlefield V /
# 2042, 7 Deadlock, 8 centimetres for a full turn (with f2_sens_dpi)
# sens_scale = 0
# The sensitivity on f2_sens_scale's scale, or the centimetres for a full turn
# sens_value = 1.0
# The mouse's DPI, for centimetres for a full turn
# sens_dpi = 800
# Debug: log once a second the speed the curve saw and the multiple it gave (tests)
# accel_debug = false

# The controller's button for each of the Xbox pad's: SDL's names, "a" "b" "x" "y" being the bottom, right, left and
# top face buttons whatever they are labeled, then "leftshoulder" "rightshoulder" "lefttrigger" "righttrigger"
# "start" "back" "dpup" "dpdown" "dpleft" "dpright" "leftstick" "rightstick" (the stick clicks), or "none".
[pad]
a = "a"
b = "b"
x = "x"
y = "y"
black = "rightshoulder"
white = "leftshoulder"
lt = "lefttrigger"
rt = "righttrigger"
start = "start"
back = "back"
up = "dpup"
down = "dpdown"
left = "dpleft"
right = "dpright"
lthumb = "leftstick"
rthumb = "rightstick"

# [acct2-bro] CoD3's key binds: in play each key does one of the game's own actions (not a controller button), with
# CoD3's action names and default keys. Up to two keys an action, comma-separated, and up to three actions a key; ""
# leaves an action without a key. Key names as CoD3 writes them: letters and digits, SPACE TAB ENTER ESCAPE
# BACKSPACE SHIFT CTRL ALT CAPSLOCK UPARROW DOWNARROW LEFTARROW RIGHTARROW INS DEL HOME END PGUP PGDN F1-F12 KP_0-KP_9
# KP_ENTER SEMICOLON COMMA = - . / ` [ \ ] ', MOUSE1 (left) MOUSE2 (right) MOUSE3 (middle) MOUSE4 MOUSE5, MWHEELUP
# MWHEELDOWN; SDL's names work too ("Left Ctrl"). In the game's menus, on loading screens and in movies the keys are
# the controller's ([keys] below), so the menus work as before; in play a key with an action doesn't press its
# controller button. CoD3's smoke grenade, binoculars, hold breath and weapon slots have no command of their own in
# Big Red One: they stay on the controller's buttons ([keys]).
[binds]
fire = "MOUSE1"
aim = "MOUSE2"
use = "F"
reload = "R"
usereload = ""          # use or reload, the controller's X
melee = "V, MOUSE3"
usemelee = ""           # use or melee
frag = "G"
sprint = "SHIFT"
leanleft = "Q"
leanright = "E"
leanleftnext = ""       # lean left while aiming, switch weapons otherwise
leanrightnext = ""
jump = "SPACE"          # jump; from crouch or prone, stand up
moveup = ""             # raise stance, jump when standing
usemoveup = ""
crouch = "C"            # crouch; again, stand up
crouchhold = ""         # crouch while held
prone = "CTRL"          # go prone; again, stand up
pronehold = ""          # prone while held
lowerstance = ""
raisestance = ""
weapnext = "MWHEELDOWN"
weapprev = "MWHEELUP"
weapalt = ""            # the weapon's other mode
scores = ""             # objectives while held (the controller's back shows them too)

# The keyboard's keys and the mouse's buttons for each of the pad's inputs and the sticks' directions: key names as
# SDL writes them ("W", "Space", "Left Ctrl", "Left Shift", "Return", "Escape", "Tab", "Up", "Keypad 8", ...) and
# mouse1 (left) to mouse5 (SDL's numbers: mouse2 the middle, mouse3 the right), up to four each, comma-separated; ""
# for none. In play, a key that has an action in [binds] does only that.
[keys]
move_forward = "W"
move_back = "S"
move_left = "A"
move_right = "D"
look_up = "Up"
look_down = "Down"
look_left = "Left"
look_right = "Right"
a = "Space"
b = "Left Ctrl"
x = "R"
y = "F"
black = "E"
white = "Q"
lt = "Z,mouse3"
rt = "X,mouse1"
start = "Return"
back = "Escape"
up = "1"
down = "2"
left = "3"
right = "4"
lthumb = "Left Shift"
rthumb = "V"
