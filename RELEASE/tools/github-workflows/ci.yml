# Checks every push and pull request: no game data, the Rust tools build and
# pass their tests on Linux and Windows, and the setup tool loads and passes
# its tests on the oldest and newest supported Python.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_repo.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: cargo run --release --locked -p rip -- version

  setup-tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q COD_3_WAW_Setup-tool
      - run: python COD_3_WAW_Setup-tool/cod3_waw_setup.py --help
      - run: python -m unittest discover -s COD_3_WAW_Setup-tool/tests -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning setup.sh tools/run_local.sh COD_3_WAW_Setup-tool/setup.sh
